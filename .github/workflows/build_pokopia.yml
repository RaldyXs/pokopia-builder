name: Compilar IPA de Pokemon Pokopia (Gratis macOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: xcode-27 # Apple Silicon con macOS 27, Xcode 27 y Metal 4 nativo
    timeout-minutes: 180

    steps:
      - name: Checkout este repositorio
        uses: actions/checkout@v4

      - name: Configurar Xcode 27 con iOS 27 SDK
        run: |
          ls -ld /Applications/Xcode* || true
          if [ -d "/Applications/Xcode_27.1.app" ]; then
            echo "Seleccionando Xcode 27.1"
            sudo xcode-select -s /Applications/Xcode_27.1.app
          elif [ -d "/Applications/Xcode_27.2.app" ]; then
            echo "Seleccionando Xcode 27.2"
            sudo xcode-select -s /Applications/Xcode_27.2.app
          elif [ -d "/Applications/Xcode_27.2_Release_Candidate.app" ]; then
            echo "Seleccionando Xcode 27.2 RC"
            sudo xcode-select -s /Applications/Xcode_27.2_Release_Candidate.app
          else
            XCODE_APP=$(ls -d /Applications/Xcode*27*.app /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
            echo "Seleccionando: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version || true

          for i in 1 2 3; do
            if xcrun -sdk iphoneos metal --version 2>/dev/null; then
              echo "[OK] Metal compiler disponible!"
              break
            fi
            echo "[*] Intento $i descargando MetalToolchain..."
            sudo xcodebuild -downloadComponent MetalToolchain || true
            sleep 3
          done
          xcrun -sdk iphoneos metal --version || true

          # Fuente fallback si es necesario
          if [ ! -f "/System/Library/Fonts/Supplemental/Arial Unicode.ttf" ]; then
            FONT=$(find /System/Library/Fonts /Library/Fonts -name "*.ttf" 2>/dev/null | head -n 1)
            echo "STD_FONT=$FONT" >> $GITHUB_ENV
          fi

      - name: Instalar dependencias del sistema y Python
        run: |
          brew install xcodegen zstd glslang spirv-cross
          brew install --cask dotnet-sdk
          python3 -m pip install lz4 "capstone>=5,<6" fonttools requests pillow "git+https://github.com/a55uka/nup.git#subdirectory=tools/nup" --break-system-packages

      - name: Clonar y configurar pokopia-native oficial
        run: |
          git clone https://github.com/xFractals/pokopia-native.git "$HOME/pokopia-native"
          
          # Aplicar parche ANTES de setup para adaptar versión 2.0.1a y omitir bloqueos
          python3 "$GITHUB_WORKSPACE/patch_pokopia.py" "$HOME/pokopia-native"

          cd "$HOME/pokopia-native"
          python3 nxs2.py setup

      - name: Descargar dump NUP desde la Release privada
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          mkdir -p "$HOME/GameFolder"
          echo "[*] Descargando las 12 partes del NUP desde RaldyXs/nxnative-builder..."
          gh release download pokemon-pokopia --pattern "PokemonPokopia.nup.part*" --dir "$HOME/GameFolder" --repo RaldyXs/nxnative-builder

          echo "[*] Uniendo partes del archivo NUP..."
          cat "$HOME/GameFolder"/PokemonPokopia.nup.part* > "$HOME/GameFolder/PokemonPokopia.nup"
          rm -f "$HOME/GameFolder"/PokemonPokopia.nup.part*
          ls -lh "$HOME/GameFolder"

      - name: Extraer dump NUP
        run: |
          mkdir -p "$HOME/dump"
          echo "[*] Extrayendo paquete update del NUP..."
          nup extract "$HOME/GameFolder/PokemonPokopia.nup" "$HOME/dump" --package update
          echo "[*] Contenido extraido:"
          ls -lh "$HOME/dump"
          ls -lh "$HOME/dump/exefs"
          ls -lh "$HOME/dump/romfs"

      - name: Restaurar cache de shaders previos
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/dump_native/shader/cache
            /Users/runner/dump_native/shader/ios
            /Users/runner/dump_native/shader/maxwell
          key: pokopia-shaders-${{ hashFiles('shdump/**') }}
          restore-keys: |
            pokopia-shaders-

      - name: Copiar env.txt para Dungeons (si existe)
        if: always()
        run: |
          if [ -f "${{ github.workspace }}/env.txt" ]; then
            echo "[INFO] Copiando env.txt al directorio de dump"
            cp "${{ github.workspace }}/env.txt" "$HOME/dump/env.txt"
          fi

      - name: Establecer variable DM_ALIAS_SIZE (fallback)
        run: |
          echo "DM_ALIAS_SIZE=0x140000000" >> $GITHUB_ENV

      - name: Compilar IPA con pokopia-native incluyendo runtime shaders (FULL SPEED)
        run: |
          cd "$HOME/pokopia-native"
          python3 nxs2.py build "$HOME/dump" --ipa --full-speed --dumps "$GITHUB_WORKSPACE/shdump"

      - name: Inspeccionar archivos generados
        run: |
          echo "Archivos generados en todo el sistema:"
          find "$HOME" -name "*.ipa" -ls 2>/dev/null || true

      - name: Diagnóstico de logs si falla
        if: always()
        run: |
          echo "=== LOGS DE COMPILACIÓN DETALLADOS ==="
          for f in $(find "$HOME/dump_native" "$HOME/pokopia-native" -name "*.log" 2>/dev/null); do
            echo "-------------------- $f --------------------"
            cat "$f"
          done

      - name: Subir nuevo IPA a la Release privada
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          echo "[*] Subiendo IPA optimizado a la Release privada 'pokemon-pokopia'..."
          for ipa in $(find "$HOME" -name "*.ipa" 2>/dev/null); do
            echo "[*] Subiendo $ipa..."
            gh release upload pokemon-pokopia "$ipa" --clobber --repo RaldyXs/nxnative-builder
          done
          echo "[OK] IPA subido a la Release privada exitosamente!"
